<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="150" viewBox="0 0 1500 150" role="img" aria-label="Let your result be your loudest voice" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Let your result be your loudest voice</title>
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07142E"/>
      <stop offset="0.5" stop-color="#1A0B3D"/>
      <stop offset="1" stop-color="#0B0620"/>
    </linearGradient>
    <filter id="qblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="qglow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="qtext" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="0.55" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="qedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="qdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="reveal">
      <rect class="type" x="400" y="40" width="700" height="60"/>
    </clipPath>
    <style>
      .mono { font-family: 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
      .type, .cur { transform-box: view-box; }
      .type { transform-origin: 400px 0; animation: type 10s infinite; }
      .cur  { animation: move 10s infinite, blink 0.9s steps(1) infinite; }
      @keyframes type {
        0%   { transform: scaleX(0); animation-timing-function: steps(36, end); }
        32%  { transform: scaleX(1); }
        86%  { transform: scaleX(1); animation-timing-function: steps(36, end); }
        96%, 100% { transform: scaleX(0); }
      }
      @keyframes move {
        0%   { transform: translateX(0); animation-timing-function: steps(36, end); }
        32%  { transform: translateX(700px); }
        86%  { transform: translateX(700px); animation-timing-function: steps(36, end); }
        96%, 100% { transform: translateX(0); }
      }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .type { animation: none; transform: scaleX(1); }
        .cur  { animation: none; transform: translateX(700px); }
      }
    </style>
  </defs>

  <rect width="1500" height="150" fill="url(#qbg)"/>
  <g filter="url(#qblur)">
    <circle cx="260" cy="120" r="150" fill="#2563EB" opacity="0.45">
      <animate attributeName="cx" values="260;420;260" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1240" cy="30" r="160" fill="#7C3AED" opacity="0.5">
      <animate attributeName="cx" values="1240;1080;1240" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="160" r="120" fill="#06B6D4" opacity="0.25"/>
  </g>
  <rect width="1500" height="150" fill="url(#qdots)"/>
  <rect x="0" y="0" width="1500" height="1.5" fill="url(#qedge)"/>

  <!-- quote: textLength pins the width so the typing mask fits on every font -->
  <g clip-path="url(#reveal)">
    <text x="400" y="88" class="mono" font-size="30" textLength="700" lengthAdjust="spacingAndGlyphs" fill="url(#qtext)" filter="url(#qglow)">Let your result be your loudest voice</text>
  </g>
  <rect class="cur" x="404" y="62" width="12" height="34" rx="2" fill="#22D3EE"/>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
